<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Doanh Thu Tuần</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <style>
        html {
            scroll-behavior: smooth
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        /* ===== THEME "TÍM ĐIỆN" — chốt 22/08/2026. Chỉ đổi nền/khung. ===== */
        :root {
            --bg: #12082b;
            /* chữ trên nền tối (tiêu đề phụ, phần ngoài thẻ) */
            --onDark: #ece2ff;
            --onDarkDim: #b9a6dd;
            /* chữ trong thẻ trắng — vẫn tối để đọc được */
            --surface: #ffffff;
            --surface2: #f2ebff;
            --border: #ddd0f5;
            --text: #1c1033;
            --text2: #5f4d85;
            --accent: #7c3aed;
            --green: #15803d;
            --red: #b91c1c;
            --purple: #7c3aed;
            --blue: #3b82f6;
            --pink: #ec4899;
            --cyan: #06b6d4;
            /* Màu dữ liệu GIỮ NGUYÊN như cũ — theme lửa chỉ đổi nền/khung */
            --cat-dautu: #7c3aed;
            --cat-ptbt: #22c55e;
            --cat-kinhdoanh: #3b82f6;
            --cat-khac: #94a3b8;
            --ch-current: #eab308;
            --ch-lastmonth: #b91c1c;
            --ch-lastyear: #9ca3af;
            --ch-avg8w: #06b6d4;

            /* ---- Thang độ nổi: cả file dùng chung một ngôn ngữ "lồi" ---- */
            --shadow-sm: 0 1px 2px rgba(18, 8, 43, .07), 0 3px 8px rgba(18, 8, 43, .09);
            --shadow-md: 0 2px 4px rgba(18, 8, 43, .09), 0 10px 24px rgba(18, 8, 43, .16);
            --shadow-lg: 0 4px 10px rgba(18, 8, 43, .16), 0 20px 50px rgba(46, 16, 101, .40);
            /* vạch sáng mép trên = cảm giác khối nổi */
            --lip: inset 0 1px 0 rgba(255, 255, 255, .95);
            --lip-dark: inset 0 1px 0 rgba(255, 255, 255, .22);
            /* mặt phẳng hơi lõm, dùng cho rãnh thanh tiến độ và ô nền */
            --groove: inset 0 1px 3px rgba(46, 16, 101, .16);
            --panel: linear-gradient(180deg, #ffffff 0%, #faf7ff 100%);
            --panel-head: linear-gradient(180deg, #f7f2ff 0%, #e9dffb 100%);

            /* ---- Thang cỡ chữ: chỉ dùng 6 bậc này, không đặt cỡ lẻ ---- */
            --fs-hero: 4.2rem;
            --fs-h2: 1.35rem;
            --fs-h3: 1.02rem;
            --fs-md: .88rem;
            --fs-sm: .82rem;
            --fs-xs: .74rem;

            /* ---- Vàng gold: vàng chanh cũ chìm trên nền trắng ---- */
            --gold: #bf8f00;
            --gold-soft: #e0ab1c;
        }

        body {
            font-family: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(900px 440px at 10% -10%, rgba(168, 85, 247, 0.38), transparent 62%),
                radial-gradient(820px 400px at 94% 2%, rgba(217, 70, 239, 0.28), transparent 60%);
            background-attachment: fixed;
            color: var(--text);
            line-height: 1.6
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px
        }

        h1 {
            font-size: 2.3rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 4px;
            letter-spacing: .5px;
            background: linear-gradient(100deg, #c084fc 0%, #e879f9 45%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text
        }

        /* emoji phải thoát khỏi gradient chữ, không thì thành ô vuông đặc */
        h1 .em {
            -webkit-text-fill-color: initial;
            background: none
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px
        }

        h2 .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block
        }

        h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text2)
        }

        .subtitle {
            text-align: center;
            color: var(--onDarkDim);
            margin-bottom: 30px;
            font-size: 1.1rem
        }

        /* Hero */
        /* Hero: tông chỉ nhỉnh hơn nền một bậc để không lạc quẻ, chia 2 cột cho khỏi trống */
        .hero {
            background:
                radial-gradient(120% 150% at 12% 0%, rgba(168, 85, 247, .30) 0%, transparent 58%),
                linear-gradient(135deg, #241058 0%, #3c1a83 46%, #5b21b6 100%);
            border: 1px solid rgba(196, 181, 253, .26);
            border-radius: 18px;
            padding: 32px 34px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-lg), var(--lip-dark);
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
            align-items: center;
            gap: 30px
        }

        .hero .heroLeft {
            text-align: center
        }

        .hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(80% 120% at 50% -20%, rgba(255, 255, 255, .10) 0%, transparent 60%);
            pointer-events: none
        }

        /* số doanh thu = điểm nhấn mạnh nhất trang */
        .hero .revenue {
            font-size: var(--fs-hero);
            font-weight: 900;
            letter-spacing: -1px;
            line-height: 1.05;
            color: #ffffff;
            text-shadow: 0 2px 3px rgba(20, 0, 45, .55), 0 12px 32px rgba(0, 0, 0, .45);
            margin: 10px 0 18px
        }

        .hero .growth {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 14px
        }

        @media (max-width: 900px) {
            .hero {
                grid-template-columns: 1fr;
                padding: 28px 20px
            }

            .hero .revenue {
                font-size: 2.6rem
            }
        }

        .hero .growth .badge {
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem
        }

        /* ===== Panel tiến độ trong hero ===== */
        /* ===== Lồi nhè nhẹ dùng chung: ô nhiệt, thanh ===== */
        /* Lớp phủ chuyển màu này chồng lên MỌI màu nền, khỏi phải tính biến thể sáng/tối riêng */
        .noi {
            background-image: linear-gradient(180deg, rgba(255, 255, 255, .30) 0%, rgba(255, 255, 255, .06) 42%, rgba(0, 0, 0, .03) 66%, rgba(0, 0, 0, .13) 100%);
            border-radius: 5px;
            box-shadow: 0 1px 2px rgba(18, 8, 43, .16)
        }

        .hm td.noi {
            font-size: var(--fs-sm);
            padding: 9px 8px;
            border: 1px solid rgba(255, 255, 255, .55)
        }

        .hm td:first-child {
            font-size: var(--fs-sm)
        }

        /* thanh trong bảng mục tiêu từng cuốn */
        .tBar {
            flex: 1;
            height: 12px;
            background: #ebe5f7;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: var(--groove)
        }

        .tBar>i {
            display: block;
            height: 100%;
            border-radius: 6px;
            background-image: linear-gradient(180deg, rgba(255, 255, 255, .34) 0%, rgba(255, 255, 255, .06) 45%, rgba(0, 0, 0, .12) 100%)
        }

        .progPanel {
            background: var(--panel);
            border-radius: 14px;
            padding: 16px 18px 14px;
            box-shadow: var(--shadow-md), var(--lip);
            border: 1px solid #e6dcfa
        }

        .progHead {
            font-size: var(--fs-sm);
            font-weight: 900;
            letter-spacing: .8px;
            color: var(--text);
            margin-bottom: 12px;
            text-align: center
        }

        .pRow {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px
        }

        .pRow.tot {
            margin: 10px 0 0;
            padding-top: 10px;
            border-top: 1px solid #ece2fa
        }

        .pName {
            min-width: 86px;
            font-size: var(--fs-sm);
            font-weight: 700;
            color: var(--text2)
        }

        .pRow.tot .pName {
            font-weight: 900;
            color: var(--text)
        }

        .pTrack {
            flex: 1;
            display: block;
            height: 12px;
            background: #ebe5f7;
            border-radius: 7px;
            overflow: hidden;
            box-shadow: var(--groove)
        }

        .pRow.tot .pTrack {
            height: 14px
        }

        .pFill {
            display: block;
            height: 100%;
            border-radius: 7px;
            background-image: linear-gradient(180deg, rgba(255, 255, 255, .34) 0%, rgba(255, 255, 255, .06) 45%, rgba(0, 0, 0, .12) 100%)
        }

        .pVal {
            min-width: 132px;
            font-size: var(--fs-sm);
            text-align: right;
            color: var(--text2);
            white-space: nowrap
        }

        .pVal b {
            font-weight: 800
        }

        .pPct {
            min-width: 56px;
            font-size: var(--fs-sm);
            font-weight: 900;
            text-align: right
        }

        .pRow.tot .pPct {
            font-size: var(--fs-md)
        }

        .badge {
            display: inline-block;
            padding: 6px 15px;
            border-radius: 999px;
            font-weight: 800;
            font-size: var(--fs-sm);
            white-space: nowrap;
            box-shadow: var(--shadow-sm), var(--lip)
        }

        .badge.up {
            background: rgba(34, 197, 94, 0.12);
            color: #15803d;
            border: 1px solid rgba(21, 128, 61, 0.35)
        }

        .badge.down {
            background: rgba(239, 68, 68, 0.10);
            color: #b91c1c;
            border: 1px solid rgba(185, 28, 28, 0.35)
        }

        /* trong hero nền tím: badge phải là khối đặc mới đọc rõ */
        .hero .badge.up {
            background: linear-gradient(180deg, #22c55e, #15803d);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .28);
            box-shadow: var(--shadow-sm), var(--lip-dark)
        }

        .hero .badge.down {
            background: linear-gradient(180deg, rgba(255, 255, 255, .20), rgba(255, 255, 255, .10));
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .34);
            box-shadow: var(--shadow-sm), var(--lip-dark)
        }

        /* Cards & Grid */
        .grid {
            display: grid;
            gap: 20px;
            margin-bottom: 30px
        }

        .grid-2 {
            grid-template-columns: repeat(2, 1fr)
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            box-shadow: var(--shadow-md), var(--lip);
            transition: transform .2s, box-shadow .2s
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg), var(--lip)
        }

        .card>h3 {
            color: var(--text);
            font-size: var(--fs-h3);
            font-weight: 800;
            letter-spacing: .2px;
            padding-left: 12px;
            border-left: 4px solid var(--accent)
        }

        .card canvas {
            max-height: 440px
        }

        /* biểu đồ nhiều dòng: bọc trong khung cao cố định, bỏ mức chặn chung */
        .khungCao {
            position: relative
        }

        .card .khungCao canvas {
            max-height: none
        }

        /* Section Divider */
        .section {
            margin: 50px 0;
            padding-top: 30px;
            border-top: 2px solid transparent;
            border-image: linear-gradient(90deg, #c084fc, #e879f9, rgba(232, 121, 249, 0)) 1
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            padding: 16px 24px;
            border-radius: 12px;
            background: linear-gradient(180deg, #ffffff 0%, #f2eafd 100%);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md), var(--lip)
        }

        .section-header h2 {
            margin: 0;
            font-size: var(--fs-h2)
        }

        /* Tables — cùng ngôn ngữ khối nổi với bảng 8 tuần */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--fs-sm)
        }

        th,
        td {
            padding: 8px 10px;
            text-align: center;
            border-bottom: 1px solid var(--border)
        }

        th {
            background: var(--panel-head);
            font-weight: 700;
            font-size: var(--fs-xs);
            color: #4c2a7a;
            border-bottom: 2px solid #cbb2ee;
            box-shadow: var(--lip);
            position: sticky;
            top: 0
        }

        td {
            color: var(--text);
            font-size: var(--fs-sm)
        }

        tr:hover td {
            background: rgba(234, 88, 12, 0.05)
        }

        /* ===== Bảng "Doanh thu 8 tuần" — thang nhiệt ===== */
        .w8 {
            border-collapse: separate;
            border-spacing: 0;
            table-layout: fixed
        }

        .w8 th {
            background: var(--panel-head);
            color: #4c2a7a;
            font-weight: 700;
            font-size: var(--fs-xs);
            line-height: 1.25;
            padding: 10px 4px;
            text-align: center;
            border-bottom: 2px solid #cbb2ee
        }

        .w8 th.now {
            background: linear-gradient(180deg, #5b21b6, #2e1065);
            color: #fff;
            box-shadow: 0 6px 16px rgba(76, 29, 149, .35)
        }

        .w8 th.tb {
            background: linear-gradient(180deg, #f4f1f7, #e4dcec);
            color: #55486b;
        }

        .w8 td {
            padding: 9px 4px;
            text-align: center;
            border-bottom: 1px solid #ece2fa
        }

        .w8 .lbl {
            text-align: left;
            font-weight: 800;
            font-size: var(--fs-sm);
            color: var(--text);
            white-space: nowrap;
            padding-left: 8px
        }

        .w8 .cls {
            text-align: left;
            font-size: var(--fs-xs);
            font-weight: 700;
            letter-spacing: .3px;
            color: #9c86c4;
            text-transform: uppercase;
            white-space: nowrap
        }

        .w8 .num {
            font-size: var(--fs-sm);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: #2e1b52;
            line-height: 1.15
        }

        /* Cột tuần báo cáo = tiêu điểm */
        .w8 td.now {
            background: linear-gradient(180deg, #f6efff, #e7d7fd);
            border-left: 2px solid #7c3aed;
            border-right: 2px solid #7c3aed
        }

        .w8 td.now .num {
            font-size: var(--fs-md);
            font-weight: 900;
            color: #4c1d95
        }

        .w8 td.tb {
            background: #f5f2f9
        }

        .w8 td.tb .num {
            color: #6b5b85;
            font-weight: 800
        }

        /* Thanh nhiệt trong ô */
        .w8 .bar {
            height: 6px;
            border-radius: 3px;
            margin: 5px auto 0;
            min-width: 3px;
            background-image: linear-gradient(180deg, rgba(255, 255, 255, .36) 0%, rgba(255, 255, 255, .06) 45%, rgba(0, 0, 0, .14) 100%)
        }

        .w8 td.now .bar {
            height: 7px;
            box-shadow: 0 1px 4px rgba(76, 29, 149, .35)
        }

        /* Chip % so TB */
        .w8 .chip {
            display: inline-block;
            min-width: 62px;
            padding: 4px 8px;
            border-radius: 999px;
            font-size: var(--fs-xs);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: #fff;
            background-image: linear-gradient(180deg, rgba(255, 255, 255, .28) 0%, rgba(255, 255, 255, .04) 46%, rgba(0, 0, 0, .12) 100%);
            box-shadow: 0 1px 3px rgba(18, 8, 43, .22)
        }

        .w8 .chip.flat {
            background: #e8e2f2;
            color: #6b5b85;
            box-shadow: none
        }

        .w8 .diff {
            font-size: var(--fs-sm);
            font-weight: 800;
            font-variant-numeric: tabular-nums
        }

        /* Dòng tiêu đề khối */
        .w8 tr.grp td {
            background: linear-gradient(90deg, #2e1065 0%, #5b21b6 48%, #a78bfa 100%);
            color: #fff;
            text-align: left;
            font-weight: 900;
            font-size: var(--fs-xs);
            letter-spacing: 1.4px;
            padding: 7px 12px;
            border-bottom: none
        }

        /* Dòng tổng hệ thống — đậm nhất */
        .w8 tr.total td {
            background: #faf6ff;
            border-bottom: 2px solid #cbb2ee
        }

        .w8 tr.total td.now {
            background: linear-gradient(180deg, #efe2ff, #ddc6fb)
        }

        .w8 tr.total .lbl,
        .w8 tr.total .num {
            font-size: var(--fs-md);
            font-weight: 900
        }

        .w8 tr.total td.now .num {
            font-size: 1.1rem
        }

        .w8 tbody tr:not(.grp):hover td {
            background: #f8f3ff
        }

        .w8 tbody tr:not(.grp):hover td.now {
            background: linear-gradient(180deg, #efe2ff, #ddc6fb)
        }

        .status-green {
            color: #22c55e;
            font-weight: 700
        }

        .status-red {
            color: #ef4444;
            font-weight: 700
        }

        .status-yellow {
            color: #facc15;
            font-weight: 700
        }

        /* Social Cards */
        .social-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px
        }

        .social-card {
            background: var(--surface2);
            border-radius: 10px;
            padding: 16px
        }

        .social-card h4 {
            font-size: .95rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px
        }

        .social-card .metric {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: .85rem;
            border-bottom: 1px solid rgba(15, 23, 42, 0.08)
        }

        .social-card .metric .val {
            font-weight: 700;
            color: var(--accent)
        }

        /* Legend */
        .legend {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            font-size: .85rem
        }

        .legend span {
            display: flex;
            align-items: center;
            gap: 6px
        }

        .legend .swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            display: inline-block
        }

        @media(max-width:768px) {
            .grid-2 {
                grid-template-columns: 1fr
            }

            .hero .revenue {
                font-size: 2.2rem
            }
        }
    </style>
</head>

    <div class="container" id="app"></div>

        // Cố ý giữ mỏng: không viền, không đổ bóng — tránh thô và dày.

        const boNoi = {
            id: 'boNoi',
            afterDatasetDraw(chart, args) {
                const meta = args.meta;
                if (!meta || meta.hidden || meta.type !== 'bar') return;
                const ngang = chart.options.indexAxis === 'y';
                const ctx = chart.ctx;
                ctx.save();
                meta.data.forEach(el => {
                    const day = ngang ? el.height : el.width;
                    if (!day || day < 3) return;
                    let l, r, t, b;
                    if (ngang) {
                        l = Math.min(el.base, el.x); r = Math.max(el.base, el.x);
                        t = el.y - day / 2; b = el.y + day / 2;
                    } else {
                        t = Math.min(el.base, el.y); b = Math.max(el.base, el.y);
                        l = el.x - day / 2; r = el.x + day / 2;
                    }
                    if (r - l < 1.5 || b - t < 1.5) return;
                    // chuyển màu chạy dọc theo BỀ DÀY của thanh thì mới ra cảm giác lồi
                    const g = ngang
                        ? ctx.createLinearGradient(0, t, 0, b)
                        : ctx.createLinearGradient(l, 0, r, 0);
                    g.addColorStop(0, 'rgba(255,255,255,.18)');

                    g.addColorStop(.64, 'rgba(0,0,0,.05)');
                    g.addColorStop(1, 'rgba(0,0,0,.17)');
                    ctx.fillStyle = g;
                    ctx.fillRect(l, t, r - l, b - t);

            <thead><tr><th style="text-align:left;min-width:140px;position:sticky;left:0;z-index:10;background:var(--surface2)">Sản phẩm</th>${dayHeaders}<th style="min-width:40px;text-align:center">Tổng</th></tr></thead>
            <tbody>${dayRows}
              <tr style="border-top:2px solid #bf8f00"><td style="text-align:left;position:sticky;left:0;background:var(--surface2);font-weight:800;font-size:var(--fs-sm)">Tổng</td>${totalCells}<td style="text-align:center;font-weight:700;color:#bf8f00">${grandTotal}</td></tr>
            </tbody>
          </table>
        </div>`;
            }

            // Bảng mục tiêu
            let targetHtml = '';
            if (cat.bookTargets) {
                const tRows = cat.bookTargets.map(b => {
                    // Sách KHÔNG đặt mục tiêu (mục tiêu = 0) thì để gạch ngang trung tính —
                    // hiện 0,0% màu báo động là sai nghĩa, nó không hề bán kém
                    const coMT = b.target > 0;
                    const pct = coMT ? (b.actual / b.target * 100) : 0;
                    const pctStr = coMT ? pct.toFixed(1).replace('.', ',') + '%' : '—';
                    const pctColor = coMT ? mauNguong(pct) : '#a99cc4';   // dùng chung quy ước ngưỡng
                    const barW = coMT ? Math.min(pct, 100) : 0;
                    return `<tr>
                      <td style="text-align:left;font-weight:700;font-size:var(--fs-sm);border:1px solid rgba(15,23,42,0.12)">${b.name}</td>
                      <td style="text-align:center;font-weight:600;border:1px solid rgba(15,23,42,0.12)">${b.actual}</td>
                      <td style="text-align:center;color:var(--text2);border:1px solid rgba(15,23,42,0.12)">${coMT ? b.target : '—'}</td>
                      <td style="border:1px solid rgba(15,23,42,0.12);padding:4px 8px">
                        <div style="display:flex;align-items:center;gap:8px">
                          <div class="tBar"><i style="width:${barW}%;background-color:${pctColor}"></i></div>
                          <span style="font-weight:800;font-size:var(--fs-sm);color:${pctColor};min-width:54px;text-align:right">${pctStr}</span>
                        </div>
                      </td>
                    </tr>`;
                }).join('');
                targetHtml = `
        <div class="card" style="grid-column: 1 / -1;">
          <h3>Tiến độ so với mục tiêu tháng 8</h3>
          <table style="width:100%;border-collapse:collapse;margin-top:10px;">
            <thead><tr><th style="text-align:left;min-width:160px">Sản phẩm</th><th style="min-width:60px;text-align:center">Thực tế</th><th style="min-width:60px;text-align:center">Mục tiêu</th><th style="min-width:200px">% Hoàn thành</th></tr></thead>
            <tbody>${tRows}</tbody>
          </table>
        </div>`;
            }

            const targetActual = REPORT_DATA.targets.actual[idx];
            const targetGoal = REPORT_DATA.targets.target[idx];
            const targetPct = (targetActual / targetGoal * 100).toFixed(2).replace('.', ',');

            const headerBadge = `<div style="margin-left:auto; display:flex; align-items:center; gap: 15px;">
              <span style="font-size:var(--fs-md); color:var(--text2)">
                Thực tế: <span style="color:var(--text);font-weight:700">${fmt(targetActual)}</span> / 
                Mục tiêu: <span style="color:var(--text);font-weight:700">${fmt(targetGoal)}</span>
              </span>
              <span class="badge" style="background:${mauNguong(targetActual / targetGoal * 100)};color:#fff">${targetPct}%</span>
            </div>`;

            return `
    <div class="section" id="cat-${idx}">
      <div class="section-header" style="border-left:4px solid ${cat.color}">
        <span style="font-size:1.5rem">${cat.icon}</span>
        <h2 style="color:${cat.color}">${cat.name}</h2>
        ${headerBadge}
      </div>

      <div class="grid" style="grid-template-columns: 1fr;">
        <div class="card">
          <h3>Top 15 sản phẩm - SL bán</h3>
          <div class="legend">
            <span><i class="swatch" style="background:var(--ch-current)"></i>Tuần này</span>
            <span><i class="swatch" style="background:var(--ch-lastmonth)"></i>Tháng trước</span>
            <span><i class="swatch" style="background:var(--ch-lastyear)"></i>Năm trước</span>
            <span><i class="swatch" style="background:var(--ch-avg8w)"></i>TB 8 tuần</span>
          </div>
          <div style="overflow-x:auto; width:100%;">
            <div style="min-width: 1100px; min-height:430px;"><canvas id="chartCat${idx}Top15"></canvas></div>
          </div>
        </div>
        ${rightHtml}
        ${dailyHtml}
        ${targetHtml}
      </div>
    </div>
  `;
        }

        // ============================================================
        // 📈 CHARTS
        // ============================================================
        function buildCharts() {
            const d = REPORT_DATA;

            // Datalabels config chung cho stack & bar
            const datalabelsValueM = {
                color: '#2b1b47',
                font: { weight: 'bold', size: 12, family: "'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" },
                formatter: Math.round,
                anchor: 'end',
                align: 'top',
                formatter: (val) => val > 0 ? (val / 1000000).toFixed(1) + 'M' : ''
            };

            const datalabelsTotalM = {
                color: '#5b21b6',
                font: { weight: 'bold', size: 13, family: "'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" },
                anchor: 'end',
                align: 'top',
                formatter: (val, ctx) => {
                    let sum = 0;
                    let dataArr = ctx.chart.data.datasets.map(ds => ds.data[ctx.dataIndex]);
                    dataArr.forEach(data => { sum += data; });
                    // Chỉ in ra ở dataset cuối cùng (trên cùng)
                    if (ctx.datasetIndex === ctx.chart.data.datasets.length - 1) {
                        return (sum / 1000000).toFixed(1) + 'M';
                    }
                    return '';
                }
            };

            // Stacked category chart
            newChart('chartCatStack', 'bar', {
                labels: d.overview.stackedByCategory.labels,
                datasets: [
                    { label: 'Khác', data: d.overview.stackedByCategory.khac, backgroundColor: '#94a3b8' },
                    { label: 'Đầu Tư', data: d.overview.stackedByCategory.dauTu, backgroundColor: '#7c3aed' },
                    { label: 'PTBT', data: d.overview.stackedByCategory.ptbt, backgroundColor: '#22c55e' },
                    { label: 'Kinh Doanh', data: d.overview.stackedByCategory.kinhDoanh, backgroundColor: '#3b82f6' }
                ]
            }, {
                scales: {
                    x: { stacked: true, ticks: { color: '#3c2a5e' }, grid: { color: 'rgba(76,29,149,0.12)' } },
                    y: { stacked: true, ticks: { color: '#3c2a5e', callback: v => fmtM(v) }, grid: { color: 'rgba(76,29,149,0.12)' } }
                },
                plugins: {
                    datalabels: {
                        color: '#fff',
                        font: { weight: 'bold', size: 12, family: "'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" },
                        anchor: 'center',
                        align: 'center',
                        formatter: (val) => val > 0 ? (val / 1000000).toFixed(1) + 'M' : ''
                    }
                },
                corePlugins: [{
                    id: 'totalLabelsVert',
                    afterDatasetsDraw(chart) {
                        const { ctx, data } = chart;
                        ctx.save();
                        ctx.fillStyle = '#b45309';
                        ctx.font = 'bold 13px Montserrat, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';
                        data.labels.forEach((_, i) => {
                            let sum = 0;
                            let barX = 0;
                            let minY = chart.chartArea.bottom;
                            data.datasets.forEach((ds, j) => {
                                if (chart.isDatasetVisible(j)) {
                                    sum += ds.data[i];
                                    const meta = chart.getDatasetMeta(j).data[i];
                                    if (meta) {
                                        barX = meta.x;
                                        minY = Math.min(minY, meta.y);
                                    }
                                }
                            });
                            if (sum > 0) {
                                ctx.fillText((sum / 1000000).toFixed(1) + 'M', barX, minY - 4);
                            }
                        });
                        ctx.restore();
                    }
                }]
            });

            // Channel chart
            newChart('chartChannel', 'bar', {
                labels: d.channels.labels,
                datasets: [
                    { label: 'Tuần này', data: d.channels.current, backgroundColor: '#eab308' },
                    { label: 'Tháng trước', data: d.channels.lastMonth, backgroundColor: '#b91c1c' },
                    { label: 'Năm trước', data: d.channels.lastYear, backgroundColor: '#9ca3af' }
                ]
            }, {
                scales: {
                    x: { ticks: { color: '#3c2a5e' }, grid: { display: false } },
                    // grace = nới trần trục y thêm 18% so với cột cao nhất. Không có nó thì cột
                    // cao nhất (Shopee năm trước) đụng trần, nhãn số của nó tràn lên đè chú thích.
                    y: { grace: '18%', ticks: { color: '#3c2a5e', callback: v => fmtM(v) }, grid: { color: 'rgba(76,29,149,0.12)' } }
                },
                plugins: {
                    // Cột hẹp, 3 nhãn sát nhau nên chữ đè lên nhau. Đẩy nhãn cột giữa lên cao
                    // hơn hẳn để tách theo chiều dọc — KHÔNG dùng display:'auto' vì nó ẩn mất số.
                    datalabels: {
                        ...datalabelsValueM,
                        font: { weight: 'bold', size: 11, family: "'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" },
                        offset: ctx => ctx.datasetIndex === 1 ? 18 : 2
                    }
                }
            });

            // Top 20
            const t20 = d.top20.products;
            newChart('chartTop20', 'bar', {
                labels: t20.map(p => p.name),
                datasets: [
                    { label: 'Shopee', data: t20.map(p => p.shopee), backgroundColor: '#ef4444' },
                    { label: 'TikTok', data: t20.map(p => p.tiktok), backgroundColor: '#171717' },
                    { label: 'Webshop', data: t20.map(p => p.webshop), backgroundColor: '#22c55e' },
                    { label: 'Tiki', data: t20.map(p => p.tiki), backgroundColor: '#3b82f6' },
                    { label: 'Lazada', data: t20.map(p => p.lazada), backgroundColor: '#f59e0b' }
                ]
            }, {
                indexAxis: 'y',
                paddingRight: 40,
                scales: {
                    x: { stacked: true, ticks: { color: '#3c2a5e' }, grid: { color: 'rgba(76,29,149,0.12)' } },
                    y: { stacked: true, ticks: { color: '#3c2a5e', font: { size: 13, weight: 700 }, autoSkip: false }, grid: { display: false } }
                },
                plugins: {
                    datalabels: {
                        display: function (ctx) {
                            return ctx.dataset.data[ctx.dataIndex] > 0;
                        },
                        color: 'rgba(255,255,255,.96)',
                        font: { size: 12, weight: 700 },
                        formatter: value => value
                    }
                },
                corePlugins: [{
                    id: 'totalLabels',
                    afterDatasetsDraw(chart) {
                        const { ctx, data } = chart;
                        ctx.save();
                        ctx.fillStyle = '#2b1b47';
                        ctx.font = 'bold 13px Montserrat, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif';
                        ctx.textAlign = 'left';
                        ctx.textBaseline = 'middle';
                        data.labels.forEach((_, i) => {
                            let sum = 0;
                            let maxX = 0;
                            let barY = 0;
                            data.datasets.forEach((ds, j) => {
                                if (chart.isDatasetVisible(j)) {
                                    sum += ds.data[i];
                                    const meta = chart.getDatasetMeta(j).data[i];
                                    if (meta) {
                                        maxX = Math.max(maxX, meta.x);
                                        barY = meta.y;
                                    }
                                }
                            });
                            if (sum > 0 && maxX > 0) {
                                ctx.fillText(sum, maxX + 8, barY + 1);
                            }
                        });
                        ctx.restore();
                    }
                }]
            });

            // Per-category Top 15
            d.categories.forEach((cat, i) => {
                newChart(`chartCat${i}Top15`, 'bar', {
                    labels: cat.top15.labels,
                    datasets: [
                        { label: 'Tuần này', data: cat.top15.current, backgroundColor: '#eab308' },
                        { label: 'Tháng trước', data: cat.top15.lastMonth, backgroundColor: '#b91c1c' },
                        { label: 'Năm trước', data: cat.top15.lastYear, backgroundColor: '#9ca3af' },
                        { label: 'TB 8 tuần', data: cat.top15.avg8w, backgroundColor: '#06b6d4' }
                    ]
                }, {
                    plugins: {
                        legend: { display: false },
                        datalabels: {
                            display: true,
                            color: '#5b21b6',
                            font: { size: 11, weight: 'bold' },
                            anchor: 'end',
                            align: 'top',
                            formatter: val => val > 0 ? val : ''
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                color: '#14311f',
                                font: { size: 12, weight: 'bold' },
                                maxRotation: 45,
                                minRotation: 45
                            },
                            grid: { display: false }
                        },
                        y: { ticks: { color: '#3c2a5e' }, grid: { color: 'rgba(76,29,149,0.12)' } }
                    }
                });
            });
        }

        function newChart(id, type, data, opts = {}) {
            const el = document.getElementById(id);
            if (!el) return;
            const ctx = el.getContext('2d');
            el.parentElement.style.position = 'relative';
            if (!el.parentElement.classList.contains('khungCao')) {
                el.parentElement.style.minHeight = type === 'bar' && opts.indexAxis === 'y' ? '360px' : '340px';
            }
            new Chart(ctx, {
                type,
                data,
                options: {
                    layout: { padding: { top: 20, right: opts.paddingRight || 0 } },
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#3c2a5e', font: { family: "'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif", size: 13, weight: 700 } }, ...(opts.plugins?.legend || {}) },
                        ...(opts.plugins || {})
                    },
                    scales: opts.scales || {},
                    ...(opts.indexAxis ? { indexAxis: opts.indexAxis } : {})
                },
                plugins: opts.corePlugins || []
            });
        }

        // Initialize — chờ font Montserrat tải xong rồi mới vẽ canvas
        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(render);
        } else {
            render();
        }
    </script>
</body>
